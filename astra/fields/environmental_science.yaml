# fields/environmental_science.yaml — environmental science and sustainability
# =============================================================================
# This profile covers environmental systems across climate, ecology, water,
# soil, pollution, conservation and environmental policy. It deliberately
# keeps generic methods (GIS, remote sensing, modelling) as context terms so a
# methods-heavy advert still needs environmental subject evidence to qualify.
#
# Matching rules are documented in fields/template.yaml:
# lowercase terms match case-insensitively as prefixes, while ALL-CAPS terms
# match case-sensitive whole words.

name: environmental_science
description: >
  Environmental science and sustainability — climate and atmosphere, ecology
  and biodiversity, water and hydrology, soil and land systems, pollution,
  conservation and environmental policy

# A post must match at least one of these to qualify. Keep generic methods out
# of this list; they belong in context_terms below.
core_anchors:
  - environmental scien
  - environmental research
  - environmental monitor
  - environmental assess
  - environmental impact
  - environmental pollution
  - environmental chem
  - environmental toxicolog
  - ecotoxicolog
