  - risk assessment
  - life cycle
  - carbon footprint
  - emissions inventory
  - circularity
  - nature-based solution
  - ecosystem service
  - public health

# Neighbouring fields that share vocabulary with environmental science. A
# negative term is ignored when a core anchor appears in the title, so genuine
# interdisciplinary environmental work is not discarded.
negative_terms:
  - astrophysic
  - astronom
  - particle physic
  - nuclear physic
  - quantum
  - condensed matter
  - organic synthesis
  - medicinal chem
  - drug discover
  - clinical trial
  - cell biolog
  - molecular biolog
  - genomics
  - software engineer
  - pure mathematic
  - financial econom
  - business administr

# Search phrases sent to keyword-driven boards. The first entries are used by
# sources that accept only a small number of queries.
search_terms:
  - environmental science
  - environmental research
  - climate change
  - environmental sustainability
  - ecology
  - biodiversity conservation
  - water quality
  - environmental pollution

weights:
  core_title: 5.0
  core_desc: 2.5
  context_title: 1.0
  context_desc: 0.5
  negative: -2.0
threshold: 2.0

# Environmental Science is OpenAlex field 23. OpenAlex is the primary
# supervisor source because NASA ADS is not a general environmental database.
supervisor_source: openalex
supervisor_ads_db: general
supervisor_arxiv_cat: physics.geo-ph,q-bio.PE,q-bio.EC
supervisor_field: 23
supervisor_topics:
  - T10895   # Species Distribution and Climate Change
  - T13394   # Ecology, Conservation, and Geographical Studies
  - T10029   # Climate Variability and Models
  - T11312   # Soil Moisture and Remote Sensing
  - T12773   # Water Quality and Resources Studies
  - T10330   # Hydrology and Watershed Management Studies
  - T14468   # Plant Ecology and Soil Science
  - T10190   # Air Quality and Health Impacts
  - T10435   # Environmental Impact and Sustainability
  - T12013   # Sustainable Development and Environmental Policy
  - T10564   # Wastewater Treatment and Nitrogen Removal
  - T10226   # Land Use and Ecosystem Services
supervisor_senior_signal: last_author

# Board-specific vocabularies. These IDs/slugs are the boards' own terms, not
# Astra field names. EURAXESS 195 is Environmental science; 219 is the nearby
# Geosciences facet. AcademicJobsOnline uses ES for Environmental Science.
source_options:
  euraxess:
    research_fields: [195]
    adjacent_research_fields: [219]
  academicjobsonline:
    categories: [ES]

subfields:
